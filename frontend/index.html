<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to API and image CDN so the browser opens connections before JS runs -->
    <link rel="preconnect" href="https://attractionsnepal.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://attractionsnepal.onrender.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <!-- Non-blocking font load: media=print loads without blocking render, onload swaps to all -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Google Search Console verification — replace content value with your actual token from GSC -->
    <!-- <meta name="google-site-verification" content="PASTE_YOUR_GSC_TOKEN_HERE" /> -->

    <!-- Pinterest domain verification — replace content value from Pinterest settings → Claim website -->
    <meta name="p:domain_verify" content="7a3768dff201f6a61f49e31c3725d388"/>

    <!-- Google AdSense — defer to avoid blocking FCP -->
    <script defer src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9065458316312467"
         crossorigin="anonymous"></script>
    <!-- Google Analytics — defer inline init until after parse -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GJ7T4LMRJP"></script>
    <script defer>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GJ7T4LMRJP', {
        page_path: window.location.pathname,
        send_page_view: true
      });
    </script>
    <title>AttractionsNepal — Discover Nepal's Best Places</title>
    <meta name="description" content="Explore Nepal's top tourist attractions, trekking routes, temples, and natural wonders. Your complete guide to travel in Nepal." />
  </head>
