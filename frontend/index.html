<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15803d" />
    <link rel="icon" type="image/png" href="/an_logo.png" />
    <link rel="apple-touch-icon" href="/an_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to API so the browser opens the connection before JS runs -->
    <link rel="preconnect" href="https://attractionsnepal.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://attractionsnepal.onrender.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Google Fonts — standard blocking load (non-blocking caused font override conflicts) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Google Search Console verification — replace content value with your actual token from GSC -->
    <!-- <meta name="google-site-verification" content="PASTE_YOUR_GSC_TOKEN_HERE" /> -->

    <!-- Pinterest domain verification -->
    <meta name="p:domain_verify" content="7a3768dff201f6a61f49e31c3725d388"/>

    <!-- Google Analytics — async so it never blocks render -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GJ7T4LMRJP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GJ7T4LMRJP', { page_path: window.location.pathname, send_page_view: true });
    </script>
    <!--
      Google AdSense — delayed load to avoid:
      1. Blocking the main thread during page load (TBT)
      2. Third-party cookies being set before page is interactive (Best Practices)
      Loads on first user interaction OR after 8 seconds, whichever comes first.
    -->
    <script>
      (function() {
        var loaded = false;
        function loadAdsense() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9065458316312467';
          document.head.appendChild(s);
        }
        if (document.readyState === 'complete') {
          setTimeout(loadAdsense, 1);
        } else {
          window.addEventListener('load', function() {
            ['mousedown','touchstart','keydown','scroll','mousemove'].forEach(function(e) {
              window.addEventListener(e, loadAdsense, { once: true, passive: true });
            });
            setTimeout(loadAdsense, 8000);
          });
        }
      })();
    </script>
    <title>AttractionsNepal — Discover Nepal's Best Places</title>
    <meta name="description" content="Explore Nepal's top tourist attractions, trekking routes, temples, and natural wonders. Your complete guide to travel in Nepal." />
  </head>

  </body>
